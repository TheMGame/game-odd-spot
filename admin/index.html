<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Odd Spot Content Studio</title>
  <link rel="stylesheet" href="/admin/styles.css?v=2">
  <style>
    .series-row{grid-template-columns:28px 110px 1fr auto}
    .drag-handle{cursor:grab;color:#68717d;font-size:18px;text-align:center;user-select:none}
    .series-row[draggable="true"]:active .drag-handle{cursor:grabbing}
    .cover-picker-current{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:7px;background:#f8f9fa}
    .cover-picker-current>img{width:150px;aspect-ratio:5/3;object-fit:cover;border-radius:5px;background:#e8eaee}
    .cover-picker-current small{display:block;margin:5px 0 12px;color:#68717d;text-transform:none;font-weight:400}
    .cover-dialog-backdrop{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:#11182799}
    .cover-dialog{display:flex;flex-direction:column;width:min(860px,92vw);height:min(720px,86vh);min-height:420px;background:#fff;border-radius:10px;box-shadow:0 24px 70px #0005;overflow:hidden}
    .cover-dialog .modal-header small{display:block;margin-top:5px;color:#68717d;font-weight:400}
    .cover-dialog-toolbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #e2e8f0}
    .cover-dialog-toolbar input{flex:1;min-width:0}
    .cover-dialog-toolbar span{white-space:nowrap;color:#68717d;font-size:12px}
    .cover-dialog-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));align-content:start;gap:10px;padding:16px;background:#f8f9fa}
    .cover-dialog-scroll .cover-asset[hidden]{display:none}
    .editor-back{margin:-5px 0 8px -8px;padding-left:8px}
    .cover-dialog .modal-footer span{margin-right:auto;color:#68717d;font-size:12px}
    .cover-asset{min-width:0;border:2px solid transparent;background:#fff;padding:3px;border-radius:5px;cursor:pointer;overflow:hidden}
    .cover-asset:hover{border-color:#4648d4}
    .cover-asset img{display:block;width:100%;aspect-ratio:5/3;object-fit:cover;border-radius:3px}
    .cover-asset span{display:block;padding:3px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px;color:#68717d}
  </style>
</head>
<body>
<div id="login" class="login-layer">
  <form id="login-form" class="login-card">
    <div class="brand-mark">OS</div><h1>Odd Spot Studio</h1><p>连接内容管理服务</p>
    <label>Admin API<input id="api-base" placeholder="https://api.example.com/admin/v1"></label>
    <label>管理令牌<input id="token" type="password" autocomplete="current-password"></label>
    <button class="btn primary" type="submit">进入工作台</button>
  </form>
</div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark small">OS</span><div><b>Odd Spot</b><small>CONTENT STUDIO</small></div></div>
    <nav>
      <button data-view="overview" class="nav-item active"><span>▦</span>总览</button>
      <button data-view="series" class="nav-item"><span>▤</span>内容系列</button>
      <button data-view="levels" class="nav-item"><span>◫</span>关卡管理</button>
      <button data-view="library" class="nav-item"><span>▧</span>素材库</button>
      <button data-view="review" class="nav-item"><span>✓</span>审核中心</button>
      <button data-view="feedback" class="nav-item"><span>◇</span>问题反馈</button>
      <button data-view="analytics" class="nav-item"><span>⌁</span>数据分析</button>
      <button data-view="settings" class="nav-item nav-bottom"><span>⚙</span>系统设置</button>
    </nav>
    <div class="user"><span class="avatar">AD</span><div><b>内容管理员</b><small>Administrator</small></div><button id="logout" title="退出">↪</button></div>
  </aside>
  <section class="workspace">
    <header class="topbar"><div id="breadcrumb">工作台 / 总览</div><div class="top-actions"><span class="environment">本地环境</span><span id="save-state">已同步</span><button class="icon-btn">◌</button><span class="avatar purple">AD</span></div></header>
    <main id="view"></main>
  </section>
</div>
<div id="modal-root"></div><div id="toast"></div>
<script src="/admin/app.js?v=4"></script>
</body>
</html>
