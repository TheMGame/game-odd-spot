<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Odd Spot Content Studio</title>
  <link rel="stylesheet" href="/admin/styles.css?v=2">
</head>
<body>
<div id="login" class="login-layer">
  <form id="login-form" class="login-card">
    <div class="brand-mark">OS</div><h1>Odd Spot Studio</h1><p>连接内容管理服务</p>
    <label>Admin API<input id="api-base" placeholder="https://api.example.com/admin/v1"></label>
    <label>管理令牌<input id="token" type="password" autocomplete="current-password"></label>
    <button class="btn primary" type="submit">进入工作台</button>
  </form>
</div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark small">OS</span><div><b>Odd Spot</b><small>CONTENT STUDIO</small></div></div>
    <nav>
      <button data-view="overview" class="nav-item active"><span>▦</span>总览</button>
      <button data-view="series" class="nav-item"><span>▤</span>内容系列</button>
      <button data-view="levels" class="nav-item"><span>◫</span>关卡管理</button>
      <button data-view="library" class="nav-item"><span>▧</span>素材库</button>
      <button data-view="review" class="nav-item"><span>✓</span>审核中心</button>
      <button data-view="feedback" class="nav-item"><span>◇</span>问题反馈</button>
      <button data-view="analytics" class="nav-item"><span>⌁</span>数据分析</button>
      <button data-view="settings" class="nav-item nav-bottom"><span>⚙</span>系统设置</button>
    </nav>
    <div class="user"><span class="avatar">AD</span><div><b>内容管理员</b><small>Administrator</small></div><button id="logout" title="退出">↪</button></div>
  </aside>
  <section class="workspace">
    <header class="topbar"><div id="breadcrumb">工作台 / 总览</div><div class="top-actions"><span class="environment">本地环境</span><span id="save-state">已同步</span><button class="icon-btn">◌</button><span class="avatar purple">AD</span></div></header>
    <main id="view"></main>
  </section>
</div>
<div id="modal-root"></div><div id="toast"></div>
<script src="/admin/app.js?v=4"></script>
</body>
</html>
