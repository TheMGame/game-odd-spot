limit_req_zone $binary_remote_addr zone=oddspot_api:10m rate=20r/s;

server {
    listen 80;
    server_name api.game.example.com admin.game.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.game.example.com;

    ssl_certificate /etc/letsencrypt/live/api.game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.game.example.com/privkey.pem;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_req zone=oddspot_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.game.example.com;

    ssl_certificate /etc/letsencrypt/live/admin.game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.game.example.com/privkey.pem;
    root /opt/oddspot/current/admin;
    index index.html;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://127.0.0.1:8080/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
